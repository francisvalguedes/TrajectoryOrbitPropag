[project]
name = "trajectory-orbit-propag"
version = "0.1.0"
description = "Streamlit app for orbit propagation (SGP4) and space trajectory analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "streamlit-aggrid",
    "spacetrack>=2.1.0",
    "pandas",
    "astropy",
    "sgp4",
    "pymap3d",
    "openpyxl",
    "folium",
    "streamlit-geolocation",
    "plotly",
    "httpx2>=2.9.1",
    "numpy",
    "requests",
]

[tool.uv]
package = false
